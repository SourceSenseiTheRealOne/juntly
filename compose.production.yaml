services:
  api:
    image: ${JUNTLY_API_IMAGE:?Set JUNTLY_API_IMAGE to an immutable image digest}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    environment:
      JUNTLY_API_ADDR: :8080
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set CLERK_SECRET_KEY}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:?Set CLERK_AUTHORIZED_PARTIES}
      CLERK_CLOCK_SKEW: ${CLERK_CLOCK_SKEW:-}
      JUNTLY_CONTACT_ENCRYPTION_KEY: ${JUNTLY_CONTACT_ENCRYPTION_KEY:?Set JUNTLY_CONTACT_ENCRYPTION_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?Set a rotated STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?Set STRIPE_WEBHOOK_SECRET}
      JUNTLY_PUBLIC_ORIGIN: ${JUNTLY_PUBLIC_ORIGIN:?Set the canonical HTTPS frontend origin}
      JUNTLY_PLATFORM_FEE_BPS: ${JUNTLY_PLATFORM_FEE_BPS:?Set the reviewed platform fee in basis points}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/ready || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [private]
  frontend:
    image: ${JUNTLY_FRONTEND_IMAGE:?Set JUNTLY_FRONTEND_IMAGE to an immutable image digest}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,mode=0755,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    environment:
      JUNTLY_API_ORIGIN: http://api:8080
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set CLERK_SECRET_KEY}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${JUNTLY_FRONTEND_PORT:-4200}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/pt-PT || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks: [private]
networks:
  private:
    internal: false
