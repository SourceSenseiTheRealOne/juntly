services:
  api:
    build:
      context: ./backend
    environment:
      JUNTLY_API_ADDR: :8080
      DATABASE_URL: ${DATABASE_URL:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-http://localhost:4200}
      CLERK_CLOCK_SKEW: ${CLERK_CLOCK_SKEW:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/v1/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s

  frontend:
    build:
      context: ./frontend
    environment:
      JUNTLY_API_ORIGIN: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4200:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/pt-PT || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
