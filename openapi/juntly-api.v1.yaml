      security: [{ clerkSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdministrativeModerationAction" } } } }
      responses:
        "204": { description: Moderation action applied }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
components:
  securitySchemes:
    clerkSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RequestIdHeader:
      name: X-Request-ID
      in: header
      required: false
      description: Optional client-supplied correlation identifier.
      schema:
        $ref: "#/components/schemas/RequestId"
    LocaleQuery:
      name: locale
      in: query
      required: true
      schema:
        type: string
        enum: [pt-PT, en, es]
    ListingIdPath:
      name: listingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationIdPath:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NotificationIdPath:
      name: notificationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    QuotationRequestIdPath:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    QuotationProposalIdPath:
      name: proposalId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BookingIdPath:
      name: bookingId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReviewIdPath:
      name: reviewId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProviderIdPath:
      name: providerId
      in: path
      required: true
      schema: { type: string, format: uuid }
  headers:
    RequestIdHeader:
      description: Correlation identifier attached to this response.
      schema:
        $ref: "#/components/schemas/RequestId"
  responses:
    InvalidRequest:
      description: The request is invalid.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestIdHeader"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Session authorization is missing or invalid.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestIdHeader"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Provider capability is required.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestIdHeader"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required dependency is unavailable.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestIdHeader"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested public resource is not available.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestIdHeader"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: The requested listing state or revision is stale.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestIdHeader"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [ready, database]
      properties:
        ready: { type: boolean }
        database: { type: string, enum: [ready, unavailable] }
    AdministrationMetrics:
      type: object
      additionalProperties: false
      required: [users, providers, activeListings, completedBookings, publishedReviews, openReports]
      properties:
        users: { type: integer, minimum: 0 }
        providers: { type: integer, minimum: 0 }
        activeListings: { type: integer, minimum: 0 }
        completedBookings: { type: integer, minimum: 0 }
        publishedReviews: { type: integer, minimum: 0 }
        openReports: { type: integer, minimum: 0 }
    AdministrativeReport:
      type: object
      additionalProperties: false
      required: [id, conversationId, reason, createdAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        reason: { type: string, minLength: 5, maxLength: 500 }
        createdAt: { type: string, format: date-time }
    AdministrativeReview:
      type: object
      additionalProperties: false
      required: [id, rating, body, state, createdAt]
      properties:
        id: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string, minLength: 10, maxLength: 2000 }
        state: { type: string, enum: [published, hidden] }
        createdAt: { type: string, format: date-time }
    AdministrationQueue:
      type: object
      additionalProperties: false
      required: [reports, reviews]
      properties:
        reports: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/AdministrativeReport" } }
        reviews: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/AdministrativeReview" } }
    AdministrationDashboard:
      type: object
      additionalProperties: false
      required: [metrics, queue]
      properties:
        metrics: { $ref: "#/components/schemas/AdministrationMetrics" }
        queue: { $ref: "#/components/schemas/AdministrationQueue" }
    AdministrativeModerationAction:
      type: object
      additionalProperties: false
      required: [kind, targetId, reason]
