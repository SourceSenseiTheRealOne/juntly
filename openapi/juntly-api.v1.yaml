openapi: 3.1.0
info:
  title: Juntly API
  version: 0.1.0
  summary: Versioned Juntly REST API contract.
servers:
  - url: http://localhost:8080
    description: Local Go API
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Read API health.
      description: Returns privacy-safe API health with correlation evidence.
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: API is available.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: API is unavailable.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/account:
    get:
      operationId: getAccountCapabilities
      summary: Read the current user's account capabilities.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Account capabilities are available.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountCapabilitiesResponse"
        "401":
          description: Session authorization is missing or invalid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: A required service dependency is unavailable.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateAccountCapabilities
      summary: Update the current user's provider capability.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountCapabilitiesRequest"
      responses:
        "200":
          description: Account capabilities were updated.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountCapabilitiesResponse"
        "400":
          description: The request body is invalid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Session authorization is missing or invalid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: A required service dependency is unavailable.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/reconcile:
    post:
      operationId: reconcileInternalUser
      summary: Reconcile the current verified session to an internal user.
      description: Accepts no request body and returns only opaque internal mapping data.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Internal user mapping is available.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalUserResponse"
        "401":
          description: Session authorization is missing or invalid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: A required service dependency is unavailable.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    clerkSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RequestIdHeader:
      name: X-Request-ID
      in: header
      required: false
      description: Optional client-supplied correlation identifier.
      schema:
        $ref: "#/components/schemas/RequestId"
  headers:
    RequestIdHeader:
      description: Correlation identifier attached to this response.
      schema:
        $ref: "#/components/schemas/RequestId"
  schemas:
    RequestId:
      type: string
      minLength: 8
      maxLength: 128
      pattern: "^[A-Za-z0-9._:-]+$"
      examples:
        - req_01juntlyhealth
    HealthStatus:
      type: string
      enum:
        - ok
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - version
        - checkedAt
        - requestId
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        service:
          type: string
          const: juntly-api
        version:
          type: string
          minLength: 1
          examples:
            - 0.1.0
        checkedAt:
          type: string
          format: date-time
        requestId:
          $ref: "#/components/schemas/RequestId"
    ErrorCode:
      type: string
      enum:
        - INVALID_REQUEST
        - UNAUTHORIZED
        - SERVICE_UNAVAILABLE
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - requestId
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          minLength: 1
        requestId:
          $ref: "#/components/schemas/RequestId"
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    InternalUserResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    AccountCapabilitiesResponse:
      type: object
      additionalProperties: false
      required:
        - customerEnabled
        - providerEnabled
        - onboardingCompletedAt
      properties:
        customerEnabled:
          type: boolean
          const: true
        providerEnabled:
          type: boolean
        onboardingCompletedAt:
          type: string
          format: date-time
    UpdateAccountCapabilitiesRequest:
      type: object
      additionalProperties: false
      required:
        - providerEnabled
      properties:
        providerEnabled:
          type: boolean
