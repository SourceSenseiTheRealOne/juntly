openapi: 3.1.0
info:
  title: Juntly API
  version: 0.1.0
  summary: Versioned Juntly REST API contract.
servers:
  - url: http://localhost:8080
    description: Local Go API
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Read API health.
      description: Returns privacy-safe API health with correlation evidence.
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: API is available.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: API is unavailable.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/ready:
    get:
      operationId: getReadiness
      summary: Report runtime readiness without dependency details.
      responses:
        "200": { description: Runtime dependencies are ready, content: { application/json: { schema: { $ref: "#/components/schemas/ReadinessResponse" } } } }
        "503": { description: One or more runtime dependencies are unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/ReadinessResponse" } } } }
  /api/v1/me/account:
    get:
      operationId: getAccountCapabilities
      summary: Read the current user's account capabilities.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Account capabilities are available.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountCapabilitiesResponse"
        "401":
          description: Session authorization is missing or invalid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: A required service dependency is unavailable.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateAccountCapabilities
      summary: Update the current user's provider capability.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountCapabilitiesRequest"
      responses:
        "200":
          description: Account capabilities were updated.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountCapabilitiesResponse"
        "400":
          description: The request body is invalid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Session authorization is missing or invalid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: A required service dependency is unavailable.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/contact-channels:
    get:
      operationId: getContactChannelStatuses
      summary: Read provider-owned encrypted contact channel statuses.
      security: [{ clerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/RequestIdHeader" }]
      responses:
        "200": { description: Status-only provider contact channels, content: { application/json: { schema: { $ref: "#/components/schemas/ContactChannelsResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      operationId: replaceContactChannel
      summary: Replace one provider-owned encrypted contact channel.
      security: [{ clerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/RequestIdHeader" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReplaceContactChannelRequest" } } } }
      responses:
        "200": { description: Updated status-only channel, content: { application/json: { schema: { $ref: "#/components/schemas/ContactChannelStatus" } } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/listings/{listingId}/contact-reveals:
    post:
      operationId: revealListingContact
      summary: Reveal one enabled, consented provider contact channel to an authenticated customer.
      security: [{ clerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/RequestIdHeader" }, { $ref: "#/components/parameters/ListingIdPath" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ContactRevealRequest" } } } }
      responses:
        "200": { description: Authenticated contact reveal, content: { application/json: { schema: { $ref: "#/components/schemas/ContactRevealResponse" } } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/catalog/categories:
    get:
      operationId: listServiceCategories
      summary: List active service categories in one supported locale.
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/LocaleQuery"
      responses:
        "200":
          description: Active localized service categories.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/reference/languages:
    get:
      operationId: listSpokenLanguages
      summary: List active spoken languages in one supported locale.
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/LocaleQuery"
      responses:
        "200":
          description: Active localized spoken languages.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LanguagesResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/reference/localities:
    get:
      operationId: listLocalities
      summary: List active launch localities, optionally within a radius.
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/LocaleQuery"
        - name: nearLocalityId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: radiusKm
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Active locality references with required attribution.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalitiesResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/discovery/listings:
    get:
      operationId: searchPublicListings
      summary: Search active public listings without authentication.
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/LocaleQuery"
        - name: categoryId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: q
          in: query
          required: false
          schema: { type: string, minLength: 2, maxLength: 80 }
        - name: nearLocalityId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: radiusKm
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
        - name: priceType
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ListingPriceType" }
        - name: serviceMode
          in: query
          required: false
          schema: { $ref: "#/components/schemas/PublicServiceMode" }
      responses:
        "200":
          description: Active public listing projections in deterministic relevance order.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicListingsResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/public/listings/{listingId}:
    get:
      operationId: getPublicListing
      summary: Read one active public listing without authentication.
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/LocaleQuery"
        - $ref: "#/components/parameters/ListingIdPath"
      responses:
        "200":
          description: Active public listing projection.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicListingResponse" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/me/provider-profile:
    get:
      operationId: getProviderProfile
      summary: Read the current provider's owner-only profile.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Nullable owner-only provider profile.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderProfileEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      operationId: replaceProviderProfile
      summary: Create or fully replace the current provider's owner-only profile.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceProviderProfileRequest"
      responses:
        "200":
          description: Canonical owner-only provider profile.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderProfileEnvelope"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/me/listings:
    get:
      operationId: listMyListings
      summary: List the current provider's owner-only listings.
      security: [{ clerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/RequestIdHeader" }]
      responses:
        "200": { description: Owner listings, content: { application/json: { schema: { $ref: "#/components/schemas/ListingsResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createListing
      summary: Create a private provider listing draft.
      security: [{ clerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/RequestIdHeader" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateListingRequest" } } } }
      responses:
        "200": { description: Owner listing draft, content: { application/json: { schema: { $ref: "#/components/schemas/ListingResponse" } } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/me/listings/{listingId}:
    get:
      operationId: getMyListing
      summary: Read one owner-only listing.
      security: [{ clerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/RequestIdHeader" }, { $ref: "#/components/parameters/ListingIdPath" }]
      responses:
        "200": { description: Owner listing, content: { application/json: { schema: { $ref: "#/components/schemas/ListingResponse" } } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      operationId: replaceMyDraftListing
      summary: Fully replace one owner draft listing.
      security: [{ clerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/RequestIdHeader" }, { $ref: "#/components/parameters/ListingIdPath" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReplaceDraftListingRequest" } } } }
      responses:
        "200": { description: Updated owner draft, content: { application/json: { schema: { $ref: "#/components/schemas/ListingResponse" } } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/me/listings/{listingId}/submit:
    post:
      operationId: submitListingForReview
      summary: Submit one owner draft for moderator review.
      security: [{ clerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/RequestIdHeader" }, { $ref: "#/components/parameters/ListingIdPath" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionRequest" } } } }
      responses:
        "200": { description: Pending-review listing, content: { application/json: { schema: { $ref: "#/components/schemas/ListingResponse" } } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/me/listings/{listingId}/pause:
    post:
      operationId: pauseListing
      summary: Pause one active owner listing.
      security: [{ clerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/RequestIdHeader" }, { $ref: "#/components/parameters/ListingIdPath" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionRequest" } } } }
      responses:
        "200": { description: Paused listing, content: { application/json: { schema: { $ref: "#/components/schemas/ListingResponse" } } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/me/listings/{listingId}/archive:
    post:
      operationId: archiveListing
      summary: Archive one owner listing from an allowed current state.
      security: [{ clerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/RequestIdHeader" }, { $ref: "#/components/parameters/ListingIdPath" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ArchiveListingRequest" } } } }
      responses:
        "200": { description: Archived listing, content: { application/json: { schema: { $ref: "#/components/schemas/ListingResponse" } } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/me/listings/{listingId}/media/upload-intents:
    post:
      operationId: createListingMediaUploadIntent
      summary: Create an owner-only image upload capability.
      security: [{ clerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/RequestIdHeader" }, { $ref: "#/components/parameters/ListingIdPath" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreateUploadIntentRequest" } } } }
      responses:
        "200": { description: Opaque upload capability, content: { application/json: { schema: { $ref: "#/components/schemas/UploadIntentResponse" } } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/moderation/listings:
    get:
      operationId: listPendingModerationListings
      summary: List pending-review listings for persisted moderators.
      security: [{ clerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/RequestIdHeader" }]
      responses:
        "200": { description: Pending-review listing queue, content: { application/json: { schema: { $ref: "#/components/schemas/ListingsResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/moderation/listings/{listingId}/approve:
    post:
      operationId: approveListing
      summary: Approve one pending-review listing.
      security: [{ clerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/RequestIdHeader" }, { $ref: "#/components/parameters/ListingIdPath" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RevisionRequest" } } } }
      responses:
        "200": { description: Active listing, content: { application/json: { schema: { $ref: "#/components/schemas/ListingResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/moderation/listings/{listingId}/reject:
    post:
      operationId: rejectListing
      summary: Reject one pending-review listing with bounded reason.
      security: [{ clerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/RequestIdHeader" }, { $ref: "#/components/parameters/ListingIdPath" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RejectListingRequest" } } } }
      responses:
        "200": { description: Rejected listing, content: { application/json: { schema: { $ref: "#/components/schemas/ListingResponse" } } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/auth/reconcile:
    post:
      operationId: reconcileInternalUser
      summary: Reconcile the current verified session to an internal user.
      description: Accepts no request body and returns only opaque internal mapping data.
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: Internal user mapping is available.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalUserResponse"
        "401":
          description: Session authorization is missing or invalid.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: A required service dependency is unavailable.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestIdHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/conversations:
    get:
      operationId: listConversations
      summary: List conversations for the authenticated participant.
      security: [{ clerkSession: [] }]
      responses:
        "200": { description: Participant conversations, content: { application/json: { schema: { $ref: "#/components/schemas/ConversationsResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: startListingConversation
      summary: Start or return a conversation with an active listing provider.
      security: [{ clerkSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StartConversationRequest" } } } }
      responses:
        "201": { description: Conversation started, content: { application/json: { schema: { $ref: "#/components/schemas/Conversation" } } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/me/conversations/{conversationId}/messages:
    parameters: [{ $ref: "#/components/parameters/ConversationIdPath" }]
    get:
      operationId: listConversationMessages
      summary: List private messages for an authenticated participant.
      security: [{ clerkSession: [] }]
      responses:
        "200": { description: Conversation messages, content: { application/json: { schema: { $ref: "#/components/schemas/MessagesResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: sendConversationMessage
      summary: Send a private message as an authenticated participant.
      security: [{ clerkSession: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SendMessageRequest" } } } }
      responses:
        "201": { description: Message sent, content: { application/json: { schema: { $ref: "#/components/schemas/Message" } } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/me/conversations/{conversationId}/block:
    put:
      operationId: replaceConversationBlock
      summary: Block or unblock a conversation as one of its participants.
      security: [{ clerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ConversationIdPath" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BlockConversationRequest" } } } }
      responses:
        "200": { description: Block state updated, content: { application/json: { schema: { $ref: "#/components/schemas/BlockConversationResponse" } } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/me/conversations/{conversationId}/reports:
    post:
      operationId: reportConversation
      summary: Report a private conversation or one of its messages.
      security: [{ clerkSession: [] }]
      parameters: [{ $ref: "#/components/parameters/ConversationIdPath" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReportConversationRequest" } } } }
      responses:
